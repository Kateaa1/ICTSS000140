<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<title>3 Column Grid Layout</title>
<style>
  body { margin: 0; font-family: sans-serif; color: #1a1a1a; }

  .page {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    padding: 10px;
  }

  header {
    grid-column: 1 / -1;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }
  header .brand { grid-column: span 1; background: #4d6200; color: #fff; padding: 20px; }
  header .menu { grid-column: span 2; background: #648000; color: #fff; padding: 20px; }

  main {
    grid-column: 1 / -1;
    background: #eee;
    padding: 20px;
  }

  .flex-row {
    display: flex;
    gap: 10px;
  }
  .flex-row .flex-item {
    flex: 1;
    background: #ddd;
    padding: 20px;
  }

  footer {
    grid-column: 1 / -1;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }
  footer .col { background: #ccc; padding: 20px; }
</style>
</head>
<body>

<div class="page">

  <header>
    <div class="brand">Header — 1/3</div>
    <div class="menu">Menu — 2/3</div>
  </header>

  <main>
    Body — single column
    <div class="flex-row">
      <div class="flex-item">Flex Item 1 — 50%</div>
      <div class="flex-item">Flex Item 2 — 50%</div>
    </div>
  </main>

  <footer>
    <div class="col">Footer 1 — 1/3</div>
    <div class="col">Footer 2 — 1/3</div>
    <div class="col">Footer 3 — 1/3</div>
  </footer>

</div>

</body>
</html>
